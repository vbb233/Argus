services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: argus-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus_rag}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-argus_rag}"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    build:
      context: .
      dockerfile: images/elasticsearch/Dockerfile
    container_name: argus-rag-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms384m -Xmx384m}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    # ⚠️ 上游依赖变更（2026-09-11）：
    #    MinIO 官方已于 2026-09-11 将 minio/minio 与 minio/mc 从 Docker Hub 整体移除，
    #    全部 tag 失效（含本项目原本钉死的 RELEASE.2025-09-07T16-13-09Z）。
    #    quay.io/minio/minio 亦不可用；社区版已转为 source-only 分发。
    #    此处改用社区维护的镜像副本，软件本体相同（composeObject 等 MinIO 私有 API 依然可用）。
    #
    #    上游原值：image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    #
    #    生产环境建议评估替代品（RustFS / SeaweedFS）或使用商业版 AIStor。
    image: pgsty/minio:latest
    container_name: argus-rag-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticvue:
    image: cars10/elasticvue:latest
    container_name: argus-rag-elasticvue
    restart: unless-stopped
    ports:
      - "${ELASTICVUE_PORT:-8088}:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  postgres-data:
  elasticsearch-data:
  minio-data:
